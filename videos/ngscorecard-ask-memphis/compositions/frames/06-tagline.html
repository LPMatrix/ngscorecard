<!doctype html>
<html><head><meta charset="UTF-8"/></head><body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@500;700&display=swap"/>
<style>
  #root {
    position:absolute; inset:0; container-type:size; overflow:hidden;
    --paper:#fff4dc; --ink:#132a1d; --green:#0a6b45; --yellow:#ffc93c; --sky:#7fd3e0; --coral:#ff6b57; --cream:#fffef9;
    background: radial-gradient(ellipse 85% 70% at 50% 45%, #1d3b2a 0%, #122419 55%, #0b170f 100%);
    font-family:"Inter",sans-serif;
  }
  .grain { position:absolute; inset:0; pointer-events:none; opacity:.35;
    background-image: radial-gradient(circle, rgba(255,244,220,.05) 1px, transparent 1.4px); background-size:7px 7px; }
  .d-circle { position:absolute; left:7%; top:12%; width:8cqw; height:8cqw; border-radius:50%; border:.5cqw solid rgba(255,201,60,.55); z-index:1; }
  .d-dots { position:absolute; right:6%; bottom:11%; width:12cqw; height:7cqw; z-index:1;
    background-image: radial-gradient(circle, rgba(255,244,220,.5) 1.3px, transparent 1.7px); background-size:1.8cqw 1.8cqw; }

  .eyebrow { position:absolute; z-index:4; top:11cqh; left:0; right:0; text-align:center;
    font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.7cqw; letter-spacing:.22em; text-transform:uppercase; color:var(--yellow); }
  .stack { position:absolute; z-index:3; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1cqh; }
  .ln { font-family:"Archivo Black",sans-serif; color:var(--cream); font-size:7.6cqw; line-height:1.04; letter-spacing:-.01em; }
  .hl { background:var(--yellow); color:var(--ink); box-shadow:.6cqw .6cqw 0 rgba(0,0,0,.35); padding:0 1.2cqw; }
</style>

<div id="root" data-composition-id="06-tagline" data-width="1920" data-height="1080" data-duration="4" data-layout-allow-overlap data-layout-allow-overflow>
  <div class="grain"></div>
  <div class="d-circle"></div>
  <div class="d-dots"></div>

  <div class="eyebrow clip" id="eb" data-start="0.2" data-duration="3.8">NGScorecard · Ask</div>
  <div class="stack">
    <div class="ln clip" id="l1" data-start="0.4" data-duration="3.6">Ask.</div>
    <div class="ln clip" id="l2" data-start="0.75" data-duration="3.25">Get answers.</div>
    <div class="ln clip" id="l3" data-start="1.15" data-duration="2.85">See the <span class="hl">sources.</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var tl = gsap.timeline({ paused:true });

  gsap.set("#eb",{opacity:0,y:-18,letterSpacing:"0.4em"});
  tl.to("#eb",{opacity:1,y:0,letterSpacing:"0.22em",duration:0.5,ease:"power2.out"},0.2);

  [["#l1",0.4],["#l2",0.75],["#l3",1.15]].forEach(function(p){
    gsap.set(p[0],{opacity:0,y:60,scale:0.82,transformOrigin:"center center"});
    tl.to(p[0],{opacity:1,y:0,scale:1.05,duration:0.2,ease:"power4.out"},p[1]);
    tl.to(p[0],{scale:1,duration:0.16,ease:"power2.inOut"},p[1]+0.2);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["06-tagline"] = tl;
})();
</script>
</template>
</body></html>
