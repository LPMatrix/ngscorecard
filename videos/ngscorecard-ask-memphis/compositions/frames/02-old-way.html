<!doctype html>
<html><head><meta charset="UTF-8"/></head><body>
<template>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@500;700&display=swap"/>
<style>
  #root {
    position:absolute; inset:0; container-type:size; overflow:hidden;
    --paper:#fff4dc; --ink:#132a1d; --green:#0a6b45; --yellow:#ffc93c; --sky:#7fd3e0; --coral:#ff6b57; --cream:#fffef9;
    background: var(--coral);
    font-family:"Inter",sans-serif;
  }
  .checks { position:absolute; left:0; right:0; top:0; height:2cqw;
    background: conic-gradient(var(--ink) 25%, var(--coral) 0 50%, var(--ink) 0 75%, var(--coral) 0) 0 0/4cqw 4cqw; opacity:.9; }
  .eyebrow { position:absolute; z-index:5; left:6cqw; top:6.5cqw;
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.8cqw; letter-spacing:.18em; text-transform:uppercase;
    background:var(--cream); color:var(--ink); border:.4cqw solid var(--ink); box-shadow:.6cqw .6cqw 0 var(--ink); padding:.9cqw 2cqw; transform:rotate(-2deg); }

  .stack { position:absolute; z-index:3; left:50%; top:52%; width:0; height:0; }
  .doc { position:absolute; width:28cqw; height:36cqw; background:var(--cream); border:.5cqw solid var(--ink);
    box-shadow:1.1cqw 1.1cqw 0 rgba(19,42,29,.9); padding:2.4cqw; transform-origin:center center; }
  .doc .fn { font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.5cqw; color:var(--ink); letter-spacing:.02em; margin-bottom:1.6cqw; }
  .doc .bar { height:1cqw; background:rgba(19,42,29,.14); margin-bottom:1.1cqw; border-radius:.3cqw; }
  .doc .bar.s { width:60%; } .doc .bar.m { width:85%; } .doc .bar.l { width:97%; }
  .doc .pp { position:absolute; right:2.4cqw; bottom:2cqw; font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.4cqw; color:var(--coral); }
  .d1 { transform:translate(-62%,-52%) rotate(-9deg); }
  .d2 { transform:translate(-48%,-50%) rotate(5deg); }
  .d3 { transform:translate(-34%,-48%) rotate(-3deg); }

  .stamp { position:absolute; z-index:6; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-7deg);
    font-family:"Archivo Black",sans-serif; font-size:9.5cqw; color:var(--ink);
    border:.8cqw solid var(--ink); padding:1cqw 3.4cqw .4cqw; letter-spacing:.02em;
    background:rgba(255,201,60,.0); }
  .sub { position:absolute; z-index:6; left:0; right:0; bottom:9cqw; text-align:center;
    font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:2.1cqw; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); }
  .pill { position:absolute; z-index:5; font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.5cqw; letter-spacing:.04em;
    background:var(--ink); color:var(--cream); padding:.7cqw 1.5cqw; }
  .p1 { right:8cqw; top:20cqw; transform:rotate(4deg); } .p2 { left:7cqw; bottom:21cqw; transform:rotate(-5deg); }
</style>

<div id="root" data-composition-id="02-old-way" data-width="1920" data-height="1080" data-duration="4" data-layout-allow-overlap data-layout-allow-overflow>
  <div class="checks"></div>
  <div class="eyebrow clip" id="eb" data-start="0.05" data-duration="3.95">The old way</div>

  <div class="stack">
    <div class="doc d1 clip" id="d1" data-start="0.35" data-duration="3.65">

      <div class="bar m"></div><div class="bar l"></div><div class="bar s"></div><div class="bar l"></div><div class="bar m"></div>
      <div class="pp">PDF · 32 pp</div>
    </div>
    <div class="doc d3 clip" id="d3" data-start="0.85" data-duration="3.15">
      <div class="fn">nhrec.gov.ng</div>
      <div class="bar l"></div><div class="bar s"></div><div class="bar m"></div><div class="bar l"></div><div class="bar l"></div>
      <div class="pp">PDF · 60 pp</div>
    </div>
  </div>

  <div class="pill p1 clip" id="p1" data-start="1.2" data-duration="2.8">8 TABS OPEN</div>
  <div class="pill p2 clip" id="p2" data-start="1.4" data-duration="2.6">~3 HOURS IN</div>

  <div class="stamp clip" id="stamp" data-start="1.75" data-duration="2.25">BURIED.</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var tl = gsap.timeline({ paused:true });
  gsap.set("#eb",{opacity:0,x:-40,rotate:-12});
  tl.to("#eb",{opacity:1,x:0,rotate:-2,duration:0.3,ease:"back.out(2)"},0.05);

  [["#d1",-9,0.35],["#d2",5,0.6],["#d3",-3,0.85]].forEach(function(p){
    gsap.set(p[0],{opacity:0});
    tl.fromTo(p[0],{y:-180,scale:1.15},{y:0,scale:1,opacity:1,duration:0.26,ease:"power3.out"},p[2]);
  });

  ["#p1","#p2"].forEach(function(id,i){
    gsap.set(id,{opacity:0,scale:0.5});
    tl.to(id,{opacity:1,scale:1,duration:0.24,ease:"back.out(2.4)"},1.2+i*0.2);
  });

  gsap.set("#stamp",{opacity:0,scale:2.4,rotate:-20});
  tl.to("#stamp",{opacity:1,scale:1,rotate:-7,duration:0.22,ease:"power4.out"},1.75)
    .to("#stamp",{scale:1.04,duration:0.1,ease:"power2.out"},1.97)
    .to("#stamp",{scale:1,duration:0.14,ease:"power2.inOut"},2.07);

  gsap.set("#sub",{opacity:0,y:20});
  tl.to("#sub",{opacity:1,y:0,duration:0.3,ease:"power2.out"},2.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["02-old-way"] = tl;
})();
</script>
