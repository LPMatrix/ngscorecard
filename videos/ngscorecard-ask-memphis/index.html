<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: #fff4dc;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="el-01-hook" class="scene" data-track-kind="graphics"
        data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html"
        data-start="0" data-duration="4.5" data-track-index="1"></div>

      <div id="el-02-old-way" class="scene" data-track-kind="graphics"
        data-composition-id="02-old-way" data-composition-src="compositions/frames/02-old-way.html"
        data-start="4.5" data-duration="4" data-track-index="1"></div>

      <div id="el-03-ask" class="scene" data-track-kind="graphics"
        data-composition-id="03-ask" data-composition-src="compositions/frames/03-ask.html"
        data-start="8.5" data-duration="5.5" data-track-index="1"></div>

      <div id="el-04-answer" class="scene" data-track-kind="graphics"
        data-composition-id="04-answer" data-composition-src="compositions/frames/04-answer.html"
        data-start="14" data-duration="7" data-track-index="1"></div>

      <div id="el-05-stamp" class="scene" data-track-kind="graphics"
        data-composition-id="05-stamp" data-composition-src="compositions/frames/05-stamp.html"
        data-start="21" data-duration="5" data-track-index="1"></div>

      <div id="el-06-tagline" class="scene" data-track-kind="graphics"
        data-composition-id="06-tagline" data-composition-src="compositions/frames/06-tagline.html"
        data-start="26" data-duration="4" data-track-index="1"></div>

      <div id="el-07-end" class="scene" data-track-kind="graphics"
        data-composition-id="07-end" data-composition-src="compositions/frames/07-end.html"
        data-start="30" data-duration="4.5" data-track-index="1"></div>

      <!-- BGM: approved civic underscore — restrained bed, eased in/out -->
      <audio id="el-bgm" src="assets/bgm.aac"
        data-start="0" data-duration="34.5" data-track-index="11"
        data-volume="0.34" data-fade-in="1.2" data-fade-out="2.8"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
