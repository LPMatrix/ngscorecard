<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var tl = gsap.timeline({ paused: true });

  gsap.set("#bw", { opacity: 1, scale: 1.04, transformOrigin: "50% 50%" });
  gsap.set("#qb", { opacity: 1 });
  tl.to("#bw", { scale: 1.10, duration: 7, ease: "power1.in" }, 0);

  tl.to("#spinner", { rotation: 540, transformOrigin: "50% 50%", duration: 1.5, ease: "linear" }, 0);
  tl.to("#searching", { opacity: 0.4, duration: 0.25, overwrite: "auto" }, 0.8);
  tl.to("#searching", { opacity: 1, duration: 0.25, overwrite: "auto" }, 1.05);
  tl.to("#searching", { opacity: 0.4, duration: 0.25, overwrite: "auto" }, 1.3);
  tl.to("#searching", { opacity: 1, duration: 0.15, overwrite: "auto" }, 1.55);

  tl.to("#sr", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 1.5);
  tl.to("#ac", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.5);

  var answerWords = "To register a business in Nigeria, apply to the Corporate Affairs Commission (CAC). Start by reserving a business name on the CAC portal, then submit form CAC 2 along with the prescribed filing fee. Once approved you receive a Certificate of Incorporation, usually within 1–5 working days.".split(" ");
  var answerEl = document.getElementById("answer-text");
  answerWords.forEach(function(word, i){
    tl.call(function(){
      if(answerEl) answerEl.textContent += (i > 0 ? " " : "") + word;
    }, [], 1.8 + i * 0.085);
  });

  tl.to("#ss", { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.5);
  tl.fromTo("#s1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 4.7);
  tl.fromTo("#s2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 4.95);

  window.__timelines = window.__timelines || {};
  window.__timelines["06-demo-answer"] = tl;
})();
</script>
