<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fffef9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-pain"
        class="scene"
        data-composition-id="02-pain"
        data-composition-src="compositions/frames/02-pain.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-brand-reveal"
        class="scene"
        data-composition-id="03-brand-reveal"
        data-composition-src="compositions/frames/03-brand-reveal.html"
        data-start="9"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-tagline"
        class="scene"
        data-composition-id="04-tagline"
        data-composition-src="compositions/frames/04-tagline.html"
        data-start="14"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-demo-ask"
        class="scene"
        data-composition-id="05-demo-ask"
        data-composition-src="compositions/frames/05-demo-ask.html"
        data-start="18"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-demo-answer"
        class="scene"
        data-composition-id="06-demo-answer"
        data-composition-src="compositions/frames/06-demo-answer.html"
        data-start="23"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-07-end-card"
        class="scene"
        data-composition-id="07-end-card"
        data-composition-src="compositions/frames/07-end-card.html"
        data-start="30"
        data-duration="5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm.aac"
        data-start="0"
        data-duration="35"
        data-track-index="11"
        data-volume="0.75"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
