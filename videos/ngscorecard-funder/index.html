    <style>

    <script>

      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-the-gap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);

        tl.fromTo("#el-09-end-card", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 32.5);
        tl.to({}, { duration: 34.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
